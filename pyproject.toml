[project]
name = "velibdata-pipeline"
version = "0.1.0"
description = "Pipeline de données VélibData — MSPR TPRE924/944 EPSI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # === Azure SDK ===
    "azure-storage-file-datalake>=12.14.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    # === Ingestion & HTTP ===
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    # === Data processing ===
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    # === Data quality ===
    "great-expectations>=0.18.0",
    # === Configuration ===
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    # === Logging ===
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "dbt-sqlserver>=1.9.1",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "mlflow>=2.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S101", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
