dbt_velibdata:
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('SQL_SERVER') }}"
      port: 1433
      database: "{{ env_var('SQL_DATABASE') }}"
      schema: dbo
      user: "{{ env_var('SQL_USER') }}"
      password: "{{ env_var('SQL_PASSWORD') }}"
      encrypt: true
      trust_cert: false
      threads: 4
  target: dev
