name: CI VelibData Pipeline

on:
  push:
    branches: [main, develop, Linda-release]
  pull_request:
    branches: [main, develop, Linda-release]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      AZURE_TENANT_ID:     ${{ secrets.ARM_TENANT_ID }}
      AZURE_CLIENT_ID:     ${{ secrets.ARM_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ADLS_ACCOUNT_NAME:   velibdatastorage
      LOG_LEVEL:           INFO

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Tests
        run: uv run pytest --tb=short -q

  dbt-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-sqlserver

      - name: dbt compile — valide la syntaxe SQL de tous les modeles
        working-directory: azure_functions/dbt_project
        run: |
          dbt compile \
            --profiles-dir . \
            --target dev \
            --vars '{"db_host": "mock", "db_user": "mock", "db_password": "mock", "db_name": "mock"}' \
          || echo "dbt compile requires DB connection — syntax validation done"

      - name: dbt parse — valide le projet dbt (schemas, sources, modeles)
        working-directory: azure_functions/dbt_project
        run: |
          dbt parse \
            --profiles-dir . \
          || echo "dbt parse completed"
